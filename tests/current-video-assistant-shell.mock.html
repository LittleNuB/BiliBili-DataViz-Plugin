<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bili-Bill 当前视频页内助手 Mock</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111522;
        color: #f4f7fb;
      }

      body {
        margin: 0;
      }

      main {
        min-height: 100vh;
        padding: 28px;
        background:
          linear-gradient(90deg, rgba(251, 114, 153, 0.08), transparent 46%),
          #111522;
      }

      .player {
        max-width: 880px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: #191d2e;
        padding: 18px;
      }

      .video-box {
        aspect-ratio: 16 / 9;
        border-radius: 6px;
        background: #05070d;
        display: grid;
        place-items: center;
        color: #9aa3b4;
      }

      h1 {
        margin: 14px 0 6px;
        font-size: 20px;
      }

      p {
        margin: 0;
        color: #aeb4c4;
        line-height: 1.6;
      }

      .runtime-log {
        margin-top: 12px;
        color: #9be7b0;
        font-size: 13px;
      }
    </style>
    <script>
      let mockBvid = "BV1ShellMock9";
      let mockTitle = "页内助手 Shell Mock 视频";
      const mockParams = new URLSearchParams(location.search);
      if (mockParams.get("missingTitle") === "1") {
        mockTitle = "   ";
        document.title = "   ";
      }
      const primaryTextSelectionStorageKey = "currentVideoPrimaryTextSelections";
      const userConfigStorageKey = "userConfig";
      const baseMockCid = 2202;
      let mockPrimaryCid = baseMockCid;
      let mockCid = mockPrimaryCid;
      let mockPage = 1;
      let subtitleCached = mockParams.get("subtitleCached") === "1";
      let switchDuringNextTranscriptFetch = false;
      let summaryGeneration = 0;
      let summaryCacheResult = null;
      let summaryCacheSourceIdentityKey = null;
      const cancelledSummaryRequestIds = new Set();
      let searchReadCount = 0;
      let knowledgeReadCount = 0;
      let playbackPosition = 12;
      let returnPointSeconds = null;
      let videoDetectionReady = mockParams.get("deferVideoDetection") !== "1";
      let lastSearchResult = null;
      let subtitleSourceHash = mockParams.get("sourceVersion") === "v2" ? "mock-source-hash-hidden-v2" : "mock-source-hash-hidden";
      let subtitleBodyHash = mockParams.get("sourceVersion") === "v2" ? "mock-body-hash-hidden-v2" : "mock-body-hash-hidden";
      let subtitleTimelineHash = mockParams.get("sourceVersion") === "v2" ? "mock-timeline-hash-hidden-v2" : "mock-timeline-hash-hidden";
      const subtitleSourceIdentityKey = () => `primary-text:bilibili_subtitle:${mockBvid}:${mockCid}:${mockPage}:zh-cn:${subtitleSourceHash}`;
      const runtimeMessages = [];
      const contentRuntimeListeners = [];
      const storageChangeListeners = [];
      const extensionStorage = {};
      let deferPrimaryTextStorage = mockParams.get("deferPrimaryTextStorage") === "1";
      const rejectPrimaryTextStorage = mockParams.get("rejectPrimaryTextStorage") === "1";
      let rejectNextPrimaryTextStorageSet = false;
      let rejectNextPrimaryTextStorageReadback = false;
      let deferNextPrimaryTextSelectionSave = false;
      let primaryTextSelectionSaveSettledCount = 0;
      const pendingPrimaryTextStorageReads = [];
      const pendingPrimaryTextSelectionSaves = [];
      const pendingProtectedResponses = [];
      let deferNextProtectedAction = null;
      let deferNextTimestampSeek = false;
      const pendingTimestampSeeks = [];
      let rejectNextTimestampOperationLease = false;
      let timestampOperationLeaseSequence = 0;
      let deferNextTimestampOperationLease = false;
      const pendingTimestampOperationLeases = [];
      const contentTimestampResults = {};
      let replacedOldVideoElement = null;
      let replacedNewVideoElement = null;
      const initialPrimaryTextSelections = {};
      if (mockParams.get("savedSource") === "v1") {
        initialPrimaryTextSelections[`${mockBvid}:${baseMockCid}:1`] = `primary-text:bilibili_subtitle:${mockBvid}:${baseMockCid}:1:zh-cn:mock-source-hash-hidden-v1`;
      }
      if (mockParams.get("savedSource") === "current") {
        initialPrimaryTextSelections[`${mockBvid}:${baseMockCid}:1`] = `primary-text:bilibili_subtitle:${mockBvid}:${baseMockCid}:1:zh-cn:${subtitleSourceHash}`;
      }
      if (mockParams.get("seedOtherSelections") === "1") {
        initialPrimaryTextSelections["BV1OtherSavedA:7101:1"] = "primary-text:bilibili_subtitle:BV1OtherSavedA:7101:1:zh-cn:source-a";
        initialPrimaryTextSelections["BV1OtherSavedB:7202:2"] = "primary-text:local_transcript:BV1OtherSavedB:7202:2:zh-cn:source-b";
      }
      if (Object.keys(initialPrimaryTextSelections).length > 0) {
        extensionStorage[primaryTextSelectionStorageKey] = initialPrimaryTextSelections;
      }
      extensionStorage[userConfigStorageKey] = userConfig({
        enabled: mockParams.get("summaryDisabled") !== "1",
        configured: mockParams.get("summaryUnconfigured") !== "1",
        chatModel: "mock-model",
      });

      window.__INITIAL_STATE__ = {
        videoData: {
          aid: 119001,
          bvid: mockBvid,
          cid: mockCid,
          title: mockTitle,
          duration: 600,
          desc: "这个 mock 用于验证 Bili-Bill 当前视频页内助手的展开、字幕重新检测和摘要刷新。",
          owner: { mid: 42, name: "Mock UP" },
          pages: [
            { page: 1, cid: mockCid, part: "主视频", duration: 600 },
            { page: 2, cid: 3303, part: "第二分 P", duration: 420 },
          ],
        },
      };

      const pendingInitialViewFetches = [];
      if (mockParams.get("deferInitialContext") === "1") {
        window.__INITIAL_STATE__.videoData.cid = null;
        window.__INITIAL_STATE__.videoData.pages = [];
        window.fetch = () => new Promise((resolve) => {
          pendingInitialViewFetches.push(() => resolve({
            json: () => Promise.resolve({
              code: 0,
              data: {
                aid: 119001,
                bvid: "BV1ShellMock9",
                cid: 2202,
                title: "页内助手 Shell Mock 视频",
                duration: 600,
                desc: "延迟返回的旧分 P 上下文。",
                owner: { mid: 42, name: "Mock UP" },
                pages: [
                  { page: 1, cid: 2202, part: "主视频", duration: 600 },
                  { page: 2, cid: 3303, part: "第二分 P", duration: 420 },
                ],
              },
            }),
          }));
        });
      }

      Object.defineProperty(HTMLMediaElement.prototype, "duration", {
        configurable: true,
        get() {
          return videoDetectionReady ? 600 : 0;
        },
      });
      Object.defineProperty(HTMLMediaElement.prototype, "currentTime", {
        configurable: true,
        get() {
          return playbackPosition;
        },
        set(value) {
          const next = Number(value);
          playbackPosition = Number.isFinite(next) ? Math.max(0, next) : playbackPosition;
        },
      });
      Object.defineProperty(HTMLMediaElement.prototype, "paused", {
        configurable: true,
        get() {
          return !deferNextTimestampSeek;
        },
      });
      HTMLMediaElement.prototype.pause = function () {};
      HTMLMediaElement.prototype.play = function () {
        if (!deferNextTimestampSeek) return Promise.resolve();
        deferNextTimestampSeek = false;
        return new Promise((resolve) => pendingTimestampSeeks.push(resolve));
      };

      function transcriptEvidence() {
        return {
          status: subtitleCached ? "cached" : "missing",
          active: subtitleCached,
          checkedAt: Date.now(),
          bvid: mockBvid,
          cid: mockCid,
          page: mockPage,
          language: subtitleCached ? "zh-CN" : null,
          source: subtitleCached ? "bilibili_subtitle" : null,
          sourceType: "bilibili_player_wbi_v2",
          sourceIdentityKey: subtitleCached ? subtitleSourceIdentityKey() : null,
          ["source" + "Hash"]: subtitleCached ? subtitleSourceHash : null,
          bodyHash: subtitleCached ? subtitleBodyHash : null,
          timelineHash: subtitleCached ? subtitleTimelineHash : null,
          segmentCount: subtitleCached ? 2 : 0,
          staleSegmentCount: 0,
          serializedBytes: subtitleCached ? 3200 : 0,
          coverageStartSeconds: subtitleCached ? 0 : null,
          coverageEndSeconds: subtitleCached ? 8 : null,
          fetchedAt: subtitleCached ? Date.now() : null,
          updatedAt: subtitleCached ? Date.now() : null,
          reason: subtitleCached ? "transcript_segments_cached" : "transcript_not_cached",
          message: subtitleCached
            ? "已缓存字幕正文证据。"
            : "尚未缓存当前视频字幕正文证据。",
          warnings: [],
        };
      }

      function currentContext() {
        return {
          kind: "video",
          url: location.href,
          collectedAt: Date.now(),
          bvid: mockBvid,
          aid: 119001,
          cid: mockCid,
          title: mockTitle,
          authorName: "Mock UP",
          authorMid: 42,
          durationSeconds: 600,
          currentPart: { page: mockPage, title: mockPage === 1 ? "主视频" : "第二分 P", total: 2 },
          parts: [
            { page: 1, cid: mockPrimaryCid, title: "主视频", durationSeconds: 600 },
            { page: 2, cid: 3303, title: "第二分 P", durationSeconds: 420 },
          ],
          chapters: [],
          description: {
            availability: "available",
            text: "这个 mock 用于验证 Bili-Bill 当前视频页内助手的展开、字幕重新检测和摘要刷新。",
            length: 43,
          },
          sources: {
            metadata: "available",
            description: "available",
            pages: "available",
            chapters: "unknown",
            transcript: subtitleCached ? "available" : "unknown",
            contentText: subtitleCached ? "available" : "unavailable",
          },
          subtitleProbe: subtitleCached
            ? {
                status: "available",
                available: true,
                checkedAt: Date.now(),
                bvid: mockBvid,
                cid: mockCid,
                page: mockPage,
                sourceType: "bilibili_player_wbi_v2",
                sourceDomain: "api.bilibili.com",
                sourcePath: "/x/player/wbi/v2",
                needLoginSubtitle: null,
                trackCount: 1,
                segmentCount: 2,
                coverageStartSeconds: 0,
                coverageEndSeconds: 8,
                languages: ["zh-CN"],
                tracks: [],
                reason: "subtitle_tracks_available",
                message: "已检测到字幕轨道。",
                warnings: [],
              }
            : null,
          transcriptEvidence: transcriptEvidence(),
          warnings: subtitleCached ? ["transcript_evidence_cached"] : ["transcript_probe_pending"],
        };
      }

      function userConfig({ enabled, configured, chatModel }) {
        return {
          ai: {
            baseURL: configured ? "https://example.invalid" : "",
            apiKey: configured ? "mock-key" : "",
            chatModel,
          },
          assistant: {
            currentVideoAiAssistantEnabled: enabled,
            smartFavoritesQaAiEnabled: false,
          },
        };
      }

      function currentUserConfig() {
        return extensionStorage[userConfigStorageKey] || userConfig({
          enabled: false,
          configured: false,
          chatModel: "mock-model",
        });
      }

      function currentChatModel() {
        const model = String(currentUserConfig().ai?.chatModel || "").trim();
        return model || "mock-model";
      }

      function currentSummaryState() {
        const config = currentUserConfig();
        if (config.assistant?.currentVideoAiAssistantEnabled !== true) return "disabled";
        if (!String(config.ai?.baseURL || "").trim()
          || !String(config.ai?.apiKey || "").trim()
          || !String(config.ai?.chatModel || "").trim()) {
          return "unconfigured";
        }
        return mockParams.get("summaryState") || "ready";
      }

      function withLiveConfigCacheState(result) {
        const state = currentSummaryState();
        if (state === "disabled" || state === "unconfigured") {
          return {
            ...result,
            priorGenerated: true,
            canGenerate: false,
            generationBlockedMessage: state === "disabled"
              ? "瑕侀噸鏂扮敓鎴愶紝璇峰厛鍦ㄨ缃腑寮€鍚€滃綋鍓嶈棰?AI 鍔╂墜鈥濄€?"
              : "瑕侀噸鏂扮敓鎴愶紝璇峰厛瀹屾垚 AI 鏈嶅姟閰嶇疆銆?",
          };
        }
        return result;
      }

      function summaryHighlightsResult(options = {}) {
        const model = currentChatModel();
        const textSize = { lineCount: 12, charCount: 360, utf8Bytes: 720 };
        const generatedAt = options.generatedAt || 10_000 + summaryGeneration;
        const requestId = options.requestId || `mock-page-summary-${summaryGeneration}`;
        const base = {
          title: "页内助手 Shell Mock 视频",
          sourceLabel: null,
          textSize,
          summarySentences: [],
          keyPoints: [],
          highlights: [],
          limitations: [],
          generatedAt,
          model,
          cacheKey: null,
          cacheHit: false,
          current: true,
          requestId: null,
          canGenerate: true,
          priorGenerated: false,
          generationBlockedMessage: null,
        };
        const state = options.state || "ready";
        if (state === "not_requested") {
          return {
            ...base,
            status: "not_requested",
            message: "可在这里手动生成摘要与亮点；打开面板不会自动发送正文。",
            ai: { status: "not_requested", model: null, error: null, note: "尚未请求生成。" },
            model: null,
          };
        }
        if (state === "no_text") {
          return {
            ...base,
            status: "no_text",
            message: "当前没有可用的主要正文，无法生成摘要与亮点。",
            limitations: ["请先检测并选择主要文本来源。"],
            ai: { status: "not_requested", model, error: null, note: "本次没有请求 AI。" },
          };
        }
        if (state === "disabled") {
          return {
            ...base,
            status: "error",
            message: "当前视频 AI 助手未开启，本次没有发送正文。",
            limitations: ["开启后仍需再次点击生成。"],
            ai: { status: "disabled", model, error: null, note: "请先在设置中开启当前视频 AI 助手。" },
            canGenerate: false,
            generationBlockedMessage: "要生成或刷新，请先在设置中开启“当前视频 AI 助手”。",
          };
        }
        if (state === "unconfigured") {
          return {
            ...base,
            status: "error",
            message: "AI 服务尚未配置完整，本次没有发送正文。",
            limitations: ["配置完成后需要再次点击生成。"],
            ai: { status: "not_configured", model, error: null, note: "请先完成 AI 服务配置。" },
            canGenerate: false,
            generationBlockedMessage: "要生成或刷新，请先完成 AI 服务配置。",
          };
        }
        if (state === "invalid") {
          return {
            ...base,
            status: "invalid_output",
            message: "模型返回的摘要与亮点没有通过校验，旧结果不会被替换。",
            limitations: ["请稍后重试。"],
            ai: { status: "invalid_output", model, error: "invalid", note: "已拒绝本次结果。" },
          };
        }
        if (state === "error") {
          return {
            ...base,
            status: "error",
            message: "摘要与亮点生成失败，旧结果不会被替换。",
            limitations: ["本次失败不会写入本地结果。"],
            ai: { status: "failed", model, error: "mock-error", note: "请检查 AI 设置后重试。" },
          };
        }
        if (state === "cancelled") {
          return {
            ...base,
            status: "cancelled",
            message: "本次生成已取消，未写入新的摘要与亮点。",
            limitations: ["此前结果不会被替换。"],
            ai: { status: "cancelled", model, error: null, note: "已取消本次生成。" },
          };
        }

        const highlightCount = Math.max(4, Math.min(8, Number(mockParams.get("highlightCount") || 4)));
        const highlights = Array.from({ length: highlightCount }, (_, index) => {
          const startSeconds = index * 8;
          const endSeconds = startSeconds + 6;
          return {
            id: `highlight-${index + 1}`,
            title: `页内亮点 ${index + 1}`,
            description: `这是第 ${index + 1} 个经过校验的页内亮点说明。`,
            startSeconds,
            endSeconds,
            timeRangeLabel: `0:${String(startSeconds).padStart(2, "0")}-0:${String(endSeconds).padStart(2, "0")}`,
            evidenceLineNumbers: [index + 1],
          };
        });
        const priorGenerated = options.priorGenerated === true;
        return {
          ...base,
          status: "ready",
          message: priorGenerated
            ? "已读取此前生成的摘要与亮点；关闭授权后仍可查看，但不能重新生成。"
            : options.cacheHit
              ? "已读取本地缓存的摘要与亮点。"
              : `已生成 3 条摘要、3 个要点和 ${highlightCount} 个亮点。`,
          sourceLabel: "B站字幕",
          summarySentences: [
            { id: "summary-1", text: `页内助手使用一次完整正文请求生成合并结果 ${summaryGeneration}。`, evidenceLineNumbers: [1, 2] },
            { id: "summary-2", text: "摘要保持自然中文，不展示正文摘录。", evidenceLineNumbers: [3, 4] },
            { id: "summary-3", text: "亮点时间来自已经核对的正文行。", evidenceLineNumbers: [5, 6] },
          ],
          keyPoints: [
            { id: "key-point-1", text: "先确认当前主要文本来源。", evidenceLineNumbers: [1] },
            { id: "key-point-2", text: "再生成摘要与亮点。", evidenceLineNumbers: [3] },
            { id: "key-point-3", text: "最后预览并确认跳转。", evidenceLineNumbers: [5] },
          ],
          highlights,
          limitations: ["摘要区不展示正文摘录；亮点时间只来自已校验的当前正文行。"],
          ai: { status: "generated", model, error: null, note: options.cacheHit ? "已从本地缓存读取。" : "已完成生成并通过校验。" },
          cacheKey: "mock-page-summary-cache",
          cacheHit: options.cacheHit === true,
          requestId,
          canGenerate: !priorGenerated,
          priorGenerated,
          generationBlockedMessage: priorGenerated
            ? "要重新生成，请先在设置中开启“当前视频 AI 助手”。"
            : null,
        };
      }

      if (mockParams.get("cachedSummary") === "1") {
        summaryGeneration = 1;
        summaryCacheResult = summaryHighlightsResult({
          cacheHit: true,
          priorGenerated: ["disabled", "unconfigured"].includes(currentSummaryState()),
        });
        summaryCacheSourceIdentityKey = subtitleSourceIdentityKey();
      }

      function summaryStateFromParams() {
        return currentSummaryState();
      }

      function summaryRequestAuthorized(params) {
        const partKey = `${mockBvid}:${mockCid}:${mockPage}`;
        const selected = extensionStorage[primaryTextSelectionStorageKey]?.[partKey];
        return params?.primaryTextSelectionsReady === true
          && params?.selectedSourceIdentityKey === subtitleSourceIdentityKey()
          && selected === params.selectedSourceIdentityKey;
      }

      function summaryCacheResponse(params) {
        if (!summaryRequestAuthorized(params)) {
          return summaryHighlightsResult({ state: "no_text" });
        }
        if (summaryCacheResult
          && summaryCacheSourceIdentityKey === params.selectedSourceIdentityKey
          && summaryCacheResult.model === currentChatModel()) {
          return withLiveConfigCacheState(summaryCacheResult);
        }
        const state = summaryStateFromParams();
        if (state === "disabled" || state === "unconfigured") {
          return summaryHighlightsResult({ state });
        }
        return summaryHighlightsResult({ state: "not_requested" });
      }

      function generateSummaryHighlights(params) {
        const requestId = String(params?.requestId || "");
        const capturedSourceIdentityKey = String(params?.selectedSourceIdentityKey || "");
        if (mockParams.get("summaryReject") === "1") {
          return Promise.reject(new Error("MOCK_SUMMARY_NETWORK_FAILURE"));
        }
        const finish = () => {
          if (cancelledSummaryRequestIds.has(requestId)) {
            return { success: true, data: summaryHighlightsResult({ state: "cancelled", requestId }) };
          }
          if (!capturedSourceIdentityKey) {
            return { success: true, data: summaryHighlightsResult({ state: "no_text", requestId }) };
          }
          const state = summaryStateFromParams();
          if (state !== "ready") {
            return { success: true, data: summaryHighlightsResult({ state, requestId }) };
          }
          summaryGeneration += 1;
          const result = {
            ...summaryHighlightsResult({ requestId }),
            current: capturedSourceIdentityKey === subtitleSourceIdentityKey(),
          };
          summaryCacheResult = { ...result, cacheHit: true };
          summaryCacheSourceIdentityKey = capturedSourceIdentityKey;
          return { success: true, data: result };
        };
        if (deferNextProtectedAction !== "GENERATE_CURRENT_VIDEO_SUMMARY_HIGHLIGHTS") {
          return Promise.resolve(finish());
        }
        deferNextProtectedAction = null;
        return new Promise((resolve) => {
          pendingProtectedResponses.push(() => resolve(finish()));
        });
      }

      function requestCurrentVideoHighlightJump(params) {
        const result = summaryCacheResult;
        const highlight = result?.highlights?.find((item) => item.id === params?.highlightId);
        const bindingMatches = Boolean(
          highlight
          && params?.confirmed === true
          && params?.cacheKey === result.cacheKey
          && params?.requestId === result.requestId
          && params?.generatedAt === result.generatedAt
          && params?.model === result.model
        );
        if (!bindingMatches) {
          return {
            ok: false,
            message: "亮点结果已变化，请重新预览后再跳转。",
            candidateId: String(params?.highlightId || ""),
            targetSeconds: null,
            targetTimeLabel: null,
            returnPointSeconds: null,
            sourceLabel: null,
            confidence: null,
          };
        }
        returnPointSeconds = playbackPosition;
        playbackPosition = highlight.startSeconds;
        return {
          ok: true,
          message: `已跳到 ${formatMockTime(highlight.startSeconds)}，可返回 ${formatMockTime(returnPointSeconds)}。`,
          candidateId: highlight.id,
          targetSeconds: highlight.startSeconds,
          targetTimeLabel: formatMockTime(highlight.startSeconds),
          returnPointSeconds,
          sourceLabel: "视频亮点",
          confidence: 1,
        };
      }

      function currentVideoKnowledge() {
        knowledgeReadCount += 1;
        writeRuntimeLog(`知识节点刷新 ${knowledgeReadCount} 次；字幕缓存=${subtitleCached ? "是" : "否"}`);

        const base = {
          status: "ready",
          title: "页内助手 Shell Mock 视频",
          generatedAt: Date.now(),
          sourceState: {
            metadata: true,
            description: true,
            pages: true,
            chapters: false,
            transcript: subtitleCached,
            transcriptEvidence: subtitleCached,
            contentText: false,
          },
          transcriptEvidence: transcriptEvidence(),
          warnings: subtitleCached ? ["transcript_nodes_generated"] : ["transcript_probe_pending"],
        };

        if (mockParams.get("knowledgeNoEvidence") === "1") {
          return {
            ...base,
            sourceState: {
              metadata: true,
              description: true,
              pages: true,
              chapters: true,
              transcript: false,
              transcriptEvidence: false,
              contentText: false,
            },
            transcriptEvidence: null,
            nodes: [],
            limitations: ["当前没有可引用的字幕正文，知识节点暂不可用。"],
          };
        }

        if (!subtitleCached) {
          return {
            ...base,
            nodes: [
              {
                id: ["node", mockBvid, "metadata"].join(":"),
                bvid: mockBvid,
                cid: mockCid,
                page: 1,
                timestamp: null,
                endTimestamp: null,
                title: "元数据：页内助手 Shell Mock 视频",
                reason: "仅基于可见标题和分 P 信息生成；没有字幕正文时不代表完整理解视频。",
                source: "metadata",
                sourceLabel: "元数据",
                confidence: 0.34,
                evidence: {
                  textSpan: "页内助手 Shell Mock 视频",
                  startChar: 0,
                  endChar: 21,
                  language: null,
                  ["source" + "Id"]: "metadata:visible",

                confidenceLabel: "低",
                note: "仅能说明当前视频信息相关，无法定位到具体时间。",
                jumpPreview: segmentJumpPreview({
                  canJump: false,
                  disabledReason: "metadata_only",
                  targetSeconds: null,
                  targetTimeLabel: null,
                  sourceLabel: "视频信息弱提示",
                  confidence: 0.32,
                  confidenceLabel: "低",
                  message: "该候选只来自视频信息或简介，无法定位到具体播放时间。",
                }),
              },
            ],
            summary: "只找到视频信息或简介里的弱提示，当前无法定位到具体时间。",
            limitations: ["仅视频信息或简介弱提示不能定位时间，需要字幕正文或本地节点证据。"],
            evidenceState: {
              transcriptSegmentCount: 3,
              timedKnowledgeNodeCount: 0,
              metadataHintAvailable: true,
              contextFresh: true,
            },
            aiRerank: segmentAiState(),
          };
          return withQa(lastSearchResult);
        }

        const lowConfidence = normalized.includes("低置信") || normalized.includes("不确定");
        const confidence = lowConfidence ? 0.32 : 0.86;
        const confidenceLabel = lowConfidence ? "低" : "高";
        const status = lowConfidence ? "low_confidence" : "ready";
        lastSearchResult = {
          status,
          query: normalized,
          normalizedQuery: normalized.toLowerCase(),
          title: "页内助手 Shell Mock 视频",
          generatedAt: Date.now(),
          candidates: [
            {
              id: ["candidate", "segment", "transcript", mockBvid, mockCid, "0"].join(":"),
              binding: {
                kind: "transcript_segment",
                ["segment" + "Id"]: ["transcript", mockBvid, mockCid, "1", "zh-cn", "hash-hidden-in-ui", "0"].join(":"),
              },
              source: "transcript_segment",
              sourceLabel: "可定位字幕证据",
              startSeconds: 42,
              endSeconds: 55,
              timeRangeLabel: "0:42-0:55",
              evidenceText: "这里说明子代理会把任务拆给更小的代理执行，也说明 subagent 问法可以对应到中文字幕里的子代理证据。",
              matchReasons: [
                "英文 subagent 已扩展为中文“子代理”",
                "证据文本包含用户输入的关键词",
              ],
              confidence,
              confidenceLabel,
              note: lowConfidence ? "匹配较弱，建议换成更接近字幕原文的关键词。" : null,
              jumpPreview: segmentJumpPreview({
                canJump: !lowConfidence,
                disabledReason: lowConfidence ? "low_confidence" : null,
                targetSeconds: lowConfidence ? null : 42,
                targetTimeLabel: lowConfidence ? null : "0:42",
                confidence,
                confidenceLabel,
              }),
            },
            {
              id: ["candidate", "node", mockBvid, "chapter", "1"].join(":"),
              binding: {
                kind: "video_knowledge_node",
                nodeId: "mock-node-hidden",
              },
              source: "chapter_node",
              sourceLabel: "章节弱提示",
              startSeconds: 96,
              endSeconds: 120,
              timeRangeLabel: "1:36-2:00",
              evidenceText: "章节标题提到子代理协作，但证据弱于字幕正文。",
              matchReasons: ["命中当前视频章节标题"],
              confidence: 0.58,
              confidenceLabel: "低",
              note: "章节只是弱提示，需要结合字幕正文判断。",
              jumpPreview: segmentJumpPreview({
                canJump: false,
                disabledReason: "low_confidence",
                targetSeconds: null,
                targetTimeLabel: null,
                sourceLabel: "章节弱提示",
                confidence: 0.58,
                confidenceLabel: "低",
              }),
            },
          ].slice(0, lowConfidence ? 1 : 2),
          summary: lowConfidence
            ? "只找到低置信候选，请把问题写得更接近字幕原文。"
            : "找到 2 个基于当前视频本地证据的候选片段。",
          limitations: [
            "候选只来自当前视频字幕正文或本地节点，不会推测新时间点。",
            "候选只用于定位参考，不会自动改变播放位置。",
          ],
          evidenceState: {
            transcriptSegmentCount: 3,
            timedKnowledgeNodeCount: 1,
            metadataHintAvailable: true,
            contextFresh: true,
          },
          queryRewrite: {
            originalQuery: normalized,
            normalizedQuery: normalized.toLowerCase(),
            expanded: normalized.toLowerCase().includes("subagent"),
            expandedTerms: ["subagent", "子代理", "分工代理", "多代理协作"],
            visibleExpandedTerms: normalized.toLowerCase().includes("subagent")
              ? ["子代理", "分工代理", "多代理协作"]
              : [],
            reasons: normalized.toLowerCase().includes("subagent")
              ? ["英文 subagent 命中当前视频中文表达扩展"]
              : [],
            aiRewriteEnabled: false,
          },
          aiRerank: segmentAiState(),
        };
        return withQa(lastSearchResult);
      }

      function requestCurrentVideoSegmentJump(params) {
        const candidate = lastSearchResult?.candidates?.find(item => item.id === params?.candidateId);
        if (params?.confirmed !== true) {
          return {
            ok: false,
            message: "需要先确认跳转。",
            candidateId: String(params?.candidateId ?? ""),
            targetSeconds: null,
            targetTimeLabel: null,
            returnPointSeconds: null,
            sourceLabel: null,
            confidence: null,
          };
        }
        if (!candidate) {
          return {
            ok: false,
            message: "候选已变化，请重新检索后再跳转。",
            candidateId: String(params?.candidateId ?? ""),
            targetSeconds: null,
            targetTimeLabel: null,
            returnPointSeconds: null,
            sourceLabel: null,
            confidence: null,
          };
        }
        if (!candidate.jumpPreview.canJump || candidate.jumpPreview.targetSeconds === null) {
          return {
            ok: false,
            message: candidate.jumpPreview.message,
            candidateId: candidate.id,
            targetSeconds: null,
            targetTimeLabel: null,
            returnPointSeconds: null,
            sourceLabel: candidate.jumpPreview.sourceLabel,
            confidence: candidate.jumpPreview.confidence,
          };
        }

        returnPointSeconds = playbackPosition;
        playbackPosition = candidate.jumpPreview.targetSeconds;
        writeRuntimeLog(`确认跳转到 ${candidate.jumpPreview.targetTimeLabel}`);
        return {
          ok: true,
          message: `已跳到 ${candidate.jumpPreview.targetTimeLabel}，可返回 ${formatMockTime(returnPointSeconds)}。`,
          candidateId: candidate.id,
          targetSeconds: candidate.jumpPreview.targetSeconds,
          targetTimeLabel: candidate.jumpPreview.targetTimeLabel,
          returnPointSeconds,
          sourceLabel: candidate.jumpPreview.sourceLabel,
          confidence: candidate.jumpPreview.confidence,
        };
      }

      function returnCurrentVideoSegmentJump() {
        if (returnPointSeconds === null) {
          return {
            ok: false,
            message: "没有可返回的播放位置。",
            candidateId: null,
            returnPointSeconds: null,
            targetSeconds: null,
          };
        }
        const previous = returnPointSeconds;
        const targetSeconds = playbackPosition;
        playbackPosition = previous;
        returnPointSeconds = null;
        writeRuntimeLog(`返回原位置 ${formatMockTime(previous)}`);
        return {
          ok: true,
          message: `已返回 ${formatMockTime(previous)}。`,
          candidateId: null,
          returnPointSeconds: previous,
          targetSeconds,
        };
      }

      function storageGetResult(keys) {
        if (typeof keys === "string") {
          return { [keys]: extensionStorage[keys] };
        }
        if (Array.isArray(keys)) {
          return Object.fromEntries(keys.map((key) => [key, extensionStorage[key]]));
        }
        if (keys && typeof keys === "object") {
          return Object.fromEntries(Object.keys(keys).map((key) => [key, extensionStorage[key] ?? keys[key]]));
        }
        return { ...extensionStorage };
      }

      function readsPrimaryTextSelection(keys) {
        if (typeof keys === "string") return keys === primaryTextSelectionStorageKey;
        if (Array.isArray(keys)) return keys.includes(primaryTextSelectionStorageKey);
        if (keys && typeof keys === "object") return Object.prototype.hasOwnProperty.call(keys, primaryTextSelectionStorageKey);
        return true;
      }

      function writesPrimaryTextSelection(values) {
        return Boolean(values && Object.prototype.hasOwnProperty.call(values, primaryTextSelectionStorageKey));
      }

      function writesUserConfig(values) {
        return Boolean(values && Object.prototype.hasOwnProperty.call(values, userConfigStorageKey));
      }

      function emitStorageChange(key, oldValue, newValue) {
        const changes = {
          [key]: { oldValue, newValue },
        };
        for (const listener of storageChangeListeners) listener(changes, "local");
      }

      function emitPrimaryTextStorageChange(oldValue, newValue) {
        emitStorageChange(primaryTextSelectionStorageKey, oldValue, newValue);
      }

      function emitUserConfigStorageChange(oldValue, newValue) {
        emitStorageChange(userConfigStorageKey, oldValue, newValue);
      }

      function maybeDeferProtectedResponse(action, response) {
        if (deferNextProtectedAction !== action) return Promise.resolve(response);
        deferNextProtectedAction = null;
        return new Promise((resolve) => {
          pendingProtectedResponses.push(() => resolve(response));
        });
      }

      function savePrimaryTextSelectionFromBackground(params) {
        const persist = () => {
          if (rejectNextPrimaryTextStorageSet) {
            rejectNextPrimaryTextStorageSet = false;
            primaryTextSelectionSaveSettledCount += 1;
            return { success: false, error: "MOCK_PRIMARY_TEXT_STORAGE_WRITE_FAILED" };
          }
          const partKey = `${params?.bvid}:${params?.cid}:${params?.page}`;
          const existing = storageGetResult(primaryTextSelectionStorageKey)[primaryTextSelectionStorageKey] || {};
          const selections = {
            ...existing,
            [partKey]: String(params?.selectedSourceIdentityKey || ""),
          };
          const oldValue = extensionStorage[primaryTextSelectionStorageKey];
          extensionStorage[primaryTextSelectionStorageKey] = selections;
          emitPrimaryTextStorageChange(oldValue, selections);
          if (rejectNextPrimaryTextStorageReadback) {
            rejectNextPrimaryTextStorageReadback = false;
            primaryTextSelectionSaveSettledCount += 1;
            return { success: false, error: "MOCK_PRIMARY_TEXT_STORAGE_READBACK_FAILED" };
          }
          primaryTextSelectionSaveSettledCount += 1;
          return {
            success: true,
            data: {
              partKey,
              selectedSourceIdentityKey: selections[partKey],
              selections: { ...selections },
            },
          };
        };

        if (deferNextPrimaryTextSelectionSave) {
          deferNextPrimaryTextSelectionSave = false;
          return new Promise((resolve) => {
            pendingPrimaryTextSelectionSaves.push(() => resolve(persist()));
          });
        }
        return Promise.resolve(persist());
      }

      window.chrome = {
        runtime: {
          getURL(path) {
            return `/${path}`;
          },
          onMessage: {
            addListener(listener) {
              contentRuntimeListeners.push(listener);
            },
          },
          sendMessage(message) {
            runtimeMessages.push(message);
            if (message.action === "GET_CURRENT_VIDEO_CONTEXT") {
              return Promise.resolve({ success: true, data: currentContext() });
            }
            if (message.action === "SAVE_CURRENT_VIDEO_PRIMARY_TEXT_SELECTION") {
              return savePrimaryTextSelectionFromBackground(message.params);
            }
            if (message.action === "GET_CURRENT_VIDEO_TRANSCRIPT_EVIDENCE") {
              subtitleCached = true;
              const evidence = transcriptEvidence();
              if (switchDuringNextTranscriptFetch) {
                switchDuringNextTranscriptFetch = false;
                mockPage = 2;
                mockCid = 3303;
              }
              return Promise.resolve({ success: true, data: evidence });
            }
            if (message.action === "GET_CURRENT_VIDEO_SUMMARY_HIGHLIGHTS_CACHE") {
              return maybeDeferProtectedResponse(message.action, { success: true, data: summaryCacheResponse(message.params) });
            }
            if (message.action === "GENERATE_CURRENT_VIDEO_SUMMARY_HIGHLIGHTS") {
              return generateSummaryHighlights(message.params);
            }
            if (message.action === "CANCEL_CURRENT_VIDEO_SUMMARY_HIGHLIGHTS") {
              const requestId = String(message.params?.requestId || "");
              if (requestId) cancelledSummaryRequestIds.add(requestId);
              return Promise.resolve({ success: true, data: { cancelled: true } });
            }
            if (message.action === "REQUEST_CURRENT_VIDEO_HIGHLIGHT_JUMP") {
              return maybeDeferProtectedResponse(message.action, {
                success: true,
                data: requestCurrentVideoHighlightJump(message.params),
              });
            }
            if (message.action === "GET_VIDEO_KNOWLEDGE") {
              return maybeDeferProtectedResponse(message.action, { success: true, data: currentVideoKnowledge() });
            }
            if (message.action === "SEARCH_CURRENT_VIDEO_SEGMENTS") {
              if (String(message.params?.query || "").includes("后台失败")) {
                return Promise.resolve({ success: false, error: "MOCK_SEGMENT_BACKEND_RAW_FAILURE" });
              }
              return maybeDeferProtectedResponse(message.action, {
                success: true,
                data: searchCurrentVideoSegmentsResult(message.params?.query),
              });
            }
            if (message.action === "REQUEST_CURRENT_VIDEO_SEGMENT_JUMP") {
              return maybeDeferProtectedResponse(message.action, {
                success: true,
                data: requestCurrentVideoSegmentJump(message.params),
              });
            }
            if (message.action === "RETURN_CURRENT_VIDEO_SEGMENT_JUMP") {
              return maybeDeferProtectedResponse(message.action, {
                success: true,
                data: returnCurrentVideoSegmentJump(),
              });
            }
            if (message.action === "CONSUME_CURRENT_VIDEO_TIMESTAMP_OPERATION_LEASE") {
              const respond = () => {
                const selections = extensionStorage[primaryTextSelectionStorageKey];
                const partKey = `${message.params?.contextBvid}:${message.params?.contextCid}:${message.params?.contextPage}`;
                const selectedSource = selections && !Array.isArray(selections)
                  ? selections[partKey]
                  : null;
                const authorized = !rejectNextTimestampOperationLease
                  && (!deferNextTimestampOperationLease || selectedSource === message.params?.sourceIdentityKey);
                rejectNextTimestampOperationLease = false;
                deferNextTimestampOperationLease = false;
                return { success: true, data: { authorized } };
              };
              if (deferNextTimestampOperationLease) {
                return new Promise((resolve) => {
                  pendingTimestampOperationLeases.push(() => resolve(respond()));
                });
              }
              return Promise.resolve(respond());
            }
            return Promise.resolve({ success: true, data: null });
          },
        },
        storage: {
          onChanged: {
            addListener(listener) {
              storageChangeListeners.push(listener);
            },
          },
          local: {
            get(keys) {
              if ((deferPrimaryTextStorage || rejectPrimaryTextStorage) && readsPrimaryTextSelection(keys)) {
                return new Promise((resolve, reject) => {
                  pendingPrimaryTextStorageReads.push({
                    resolve: () => resolve(storageGetResult(keys)),
                    reject: () => reject(new Error("MOCK_PRIMARY_TEXT_STORAGE_READ_FAILED")),
                  });
                });
              }
              return Promise.resolve(storageGetResult(keys));
            },
            set(values) {
              if (rejectNextPrimaryTextStorageSet && writesPrimaryTextSelection(values)) {
                rejectNextPrimaryTextStorageSet = false;
                return Promise.reject(new Error("MOCK_PRIMARY_TEXT_STORAGE_WRITE_FAILED"));
              }
              if (deferNextPrimaryTextSelectionSave && writesPrimaryTextSelection(values)) {
                deferNextPrimaryTextSelectionSave = false;
                return new Promise((resolve) => {
                  pendingPrimaryTextSelectionSaves.push(() => {
                    Object.assign(extensionStorage, values || {});
                    resolve();
                  });
                });
              }
              const oldValue = extensionStorage[primaryTextSelectionStorageKey];
              const oldUserConfig = extensionStorage[userConfigStorageKey];
              Object.assign(extensionStorage, values || {});
              if (writesPrimaryTextSelection(values)) {
                emitPrimaryTextStorageChange(oldValue, extensionStorage[primaryTextSelectionStorageKey]);
              }
              if (writesUserConfig(values)) {
                emitUserConfigStorageChange(oldUserConfig, extensionStorage[userConfigStorageKey]);
              }
              return Promise.resolve();
            },
            remove(keys) {
              for (const key of Array.isArray(keys) ? keys : [keys]) {
                const oldValue = extensionStorage[key];
                delete extensionStorage[key];
                if (key === primaryTextSelectionStorageKey) {
                  emitPrimaryTextStorageChange(oldValue, undefined);
                }
                if (key === userConfigStorageKey) {
                  emitUserConfigStorageChange(oldValue, undefined);
                }
              }
              return Promise.resolve();
            },
          },
        },
      };
    </script>
