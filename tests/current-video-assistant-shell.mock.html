          getURL(path) {
            return `/${path}`;
          },
          onMessage: {
            addListener(listener) {
              contentRuntimeListeners.push(listener);
            },
          },
          sendMessage(message) {
            runtimeMessages.push(message);
            if (message.action === "GET_CURRENT_VIDEO_CONTEXT") {
              return Promise.resolve({ success: true, data: currentContext() });
            }
            if (message.action === "SAVE_CURRENT_VIDEO_PRIMARY_TEXT_SELECTION") {
              return savePrimaryTextSelectionFromBackground(message.params);
            }
            if (message.action === "GET_CURRENT_VIDEO_TRANSCRIPT_EVIDENCE") {
              subtitleCached = true;
              const evidence = transcriptEvidence();
              if (switchDuringNextTranscriptFetch) {
                switchDuringNextTranscriptFetch = false;
                mockPage = 2;
                mockCid = 3303;
              }
              return Promise.resolve({ success: true, data: evidence });
            }
            if (message.action === "GET_CURRENT_VIDEO_SUMMARY") {
              return maybeDeferProtectedResponse(message.action, { success: true, data: currentSummary() });
            }
            if (message.action === "GET_VIDEO_KNOWLEDGE") {
              return maybeDeferProtectedResponse(message.action, { success: true, data: currentVideoKnowledge() });
            }
            if (message.action === "SEARCH_CURRENT_VIDEO_SEGMENTS") {
              if (String(message.params?.query || "").includes("后台失败")) {
                return Promise.resolve({ success: false, error: "MOCK_SEGMENT_BACKEND_RAW_FAILURE" });
              }
              return maybeDeferProtectedResponse(message.action, {
                success: true,
                data: searchCurrentVideoSegmentsResult(message.params?.query),
              });
            }
            if (message.action === "REQUEST_CURRENT_VIDEO_SEGMENT_JUMP") {
              return maybeDeferProtectedResponse(message.action, {
                success: true,
                data: requestCurrentVideoSegmentJump(message.params),
              });
            }
            if (message.action === "RETURN_CURRENT_VIDEO_SEGMENT_JUMP") {
              return maybeDeferProtectedResponse(message.action, {
                success: true,
                data: returnCurrentVideoSegmentJump(),
              });
            }
            if (message.action === "CONSUME_CURRENT_VIDEO_TIMESTAMP_OPERATION_LEASE") {
              const respond = () => {
                const selections = extensionStorage[primaryTextSelectionStorageKey];
                const partKey = `${message.params?.contextBvid}:${message.params?.contextCid}:${message.params?.contextPage}`;
                const selectedSource = selections && !Array.isArray(selections)
                  ? selections[partKey]
                  : null;
                const authorized = !rejectNextTimestampOperationLease
                  && (!deferNextTimestampOperationLease || selectedSource === message.params?.sourceIdentityKey);
                rejectNextTimestampOperationLease = false;
                deferNextTimestampOperationLease = false;
                return { success: true, data: { authorized } };
              };
              if (deferNextTimestampOperationLease) {
                return new Promise((resolve) => {
                  pendingTimestampOperationLeases.push(() => resolve(respond()));
                });
              }
              return Promise.resolve(respond());
            }
            return Promise.resolve({ success: true, data: null });
          },
        },
        storage: {
          onChanged: {
            addListener(listener) {
              storageChangeListeners.push(listener);
            },
          },
          local: {
            get(keys) {
              if ((deferPrimaryTextStorage || rejectPrimaryTextStorage) && readsPrimaryTextSelection(keys)) {
                return new Promise((resolve, reject) => {
                  pendingPrimaryTextStorageReads.push({
                    resolve: () => resolve(storageGetResult(keys)),
                    reject: () => reject(new Error("MOCK_PRIMARY_TEXT_STORAGE_READ_FAILED")),
                  });
                });
              }
              return Promise.resolve(storageGetResult(keys));
            },
            set(values) {
              if (rejectNextPrimaryTextStorageSet && writesPrimaryTextSelection(values)) {
                rejectNextPrimaryTextStorageSet = false;
                return Promise.reject(new Error("MOCK_PRIMARY_TEXT_STORAGE_WRITE_FAILED"));
              }
              if (deferNextPrimaryTextSelectionSave && writesPrimaryTextSelection(values)) {
                deferNextPrimaryTextSelectionSave = false;
                return new Promise((resolve) => {
                  pendingPrimaryTextSelectionSaves.push(() => {
                    Object.assign(extensionStorage, values || {});
                    resolve();
                  });
                });
              }
              const oldValue = extensionStorage[primaryTextSelectionStorageKey];
              Object.assign(extensionStorage, values || {});
              if (writesPrimaryTextSelection(values)) {
                emitPrimaryTextStorageChange(oldValue, extensionStorage[primaryTextSelectionStorageKey]);
              }
              return Promise.resolve();
            },
            remove(keys) {
              for (const key of Array.isArray(keys) ? keys : [keys]) {
                const oldValue = extensionStorage[key];
                delete extensionStorage[key];
                if (key === primaryTextSelectionStorageKey) {
                  emitPrimaryTextStorageChange(oldValue, undefined);
                }
              }
              return Promise.resolve();
            },
          },
        },
      };
    </script>
  </head>

      <div class="player">
        <div class="video-box">
          <video></video>
          <span>Mock B 站播放器</span>
        </div>
        <h1>页内助手 Shell Mock 视频</h1>
        <p>这个页面通过 localhost 视频路由，用实际 content bundle 验证页内助手行为。</p>
        <div class="runtime-log" data-testid="runtime-log">摘要尚未刷新；字幕缓存=否</div>
      </div>
