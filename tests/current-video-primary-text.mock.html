<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bili-Bill 当前视频主要文本 Mock</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111522;
        color: #f4f7fb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #111522;
      }

      main {
        width: min(880px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0;
      }

      .panel {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        padding: 16px;
        margin-top: 12px;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }

      h2 {
        font-size: 15px;
        margin: 0 0 10px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 14px;
      }

      .row span:last-child {
        text-align: right;
        overflow-wrap: anywhere;
      }

      .actions,
      .sources {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      button,
      label.toggle {
        min-height: 36px;
        border: 0;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.14);
        color: #f4f7fb;
        padding: 8px 11px;
        cursor: pointer;
        font-weight: 700;
      }

      button.primary {
        background: #fb7299;
        color: white;
      }

      button[aria-pressed="true"] {
        outline: 2px solid #9be7b0;
      }

      .status {
        line-height: 1.55;
        color: #ffcf8a;
      }

      .status.ready {
        color: #9be7b0;
      }

      .muted {
        color: #aeb4c4;
        line-height: 1.55;
        font-size: 13px;
      }

      .source-card {
        flex: 1 1 220px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        padding: 12px;
      }

      .source-card strong {
        display: block;
        margin-bottom: 6px;
      }

      .source-card[data-viewing="true"] {
        border-color: rgba(251, 114, 153, 0.72);
      }

      .source-card[data-primary="true"] {
        background: rgba(155, 231, 176, 0.10);
      }

      .hidden {
        display: none;
      }

      @media (max-width: 560px) {
        main {
          width: calc(100vw - 20px);
          padding: 12px 0;
        }

        .row {
          display: block;
        }

        .row span:last-child {
          display: block;
          margin-top: 4px;
          text-align: left;
        }

        button,
        label.toggle {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前视频主要文本</h1>

      <section class="panel">
        <h2>当前分 P</h2>
        <div class="row"><span>视频</span><span>当前视频 · 第 1 P</span></div>
        <div class="row"><span>字幕状态</span><span data-testid="subtitle-state">可能有 AI 字幕，尚未探测轨道</span></div>
        <div class="row"><span>主要文本</span><span data-testid="primary-state">暂无正文</span></div>
        <p class="status" data-testid="status">请先在 B 站播放器中手动开启“中文 AI”字幕，然后重新检测字幕。</p>
        <p class="muted" data-testid="request-count">完整文本请求：0</p>
        <div class="actions">
          <button type="button" data-testid="enable-ai-subtitle">已在播放器开启中文 AI</button>
          <button class="primary" type="button" data-testid="redetect">重新检测字幕</button>
          <button type="button" data-testid="add-local">加入已完成本地转录稿</button>
          <button type="button" data-testid="clear-current">清理当前主要文本</button>
          <label class="toggle"><input data-testid="auth-toggle" type="checkbox" /> 当前视频 AI 助手</label>
        </div>
      </section>

      <section class="panel">
        <h2>来源</h2>
        <p class="muted" data-testid="switch-hint">只有一个来源时不显示切换；有多个来源时，查看来源和主要来源分开。</p>
        <div class="sources" data-testid="sources"></div>
      </section>
    </main>

    <script>
      const state = {
        possibleAiSubtitle: true,
        trackDetected: false,
        bilibiliBody: false,
        localTranscript: false,
        viewing: null,
        primary: null,
        selectionCleared: false,
        fullTextRequests: 0,
      };

      const sourceLabels = {
        bilibili: "B站字幕",
        local: "本地转录",
      };

      function availableSources() {
        return [
          state.bilibiliBody ? "bilibili" : null,
          state.localTranscript ? "local" : null,
        ].filter(Boolean);
      }

      function render() {
        const sources = availableSources();
        const subtitleState = document.querySelector('[data-testid="subtitle-state"]');
        const primaryState = document.querySelector('[data-testid="primary-state"]');
        const status = document.querySelector('[data-testid="status"]');
        const requestCount = document.querySelector('[data-testid="request-count"]');
        const switchHint = document.querySelector('[data-testid="switch-hint"]');

        if (state.bilibiliBody) {
          subtitleState.textContent = "已取得与当前视频、CID、分 P 匹配的字幕正文";
        } else if (state.trackDetected) {
          subtitleState.textContent = "已探测到字幕轨道，尚未取得正文";
        } else {
          subtitleState.textContent = state.possibleAiSubtitle ? "可能有 AI 字幕，尚未探测轨道" : "没有探测到字幕轨道";
        }

        if (state.primary && sources.includes(state.primary)) {
          primaryState.textContent = `${sourceLabels[state.primary]}正在用于视频助手`;
          status.textContent = `${sourceLabels[state.primary]}已作为主要文本来源；不会自动发送完整文本请求。`;
          status.className = "status ready";
        } else if (sources.length === 1 && !state.primary && !state.selectionCleared) {
          state.primary = sources[0];
          state.viewing = sources[0];
          primaryState.textContent = `${sourceLabels[sources[0]]}可用`;
          status.textContent = "当前只有一个可用文本来源，无需显示切换。";
          status.className = "status ready";
        } else if (state.selectionCleared) {
          primaryState.textContent = "暂无正文";
          status.textContent = "此前主要文本来源已清理；不会自动切换到另一个来源，请重新检测或明确选择。";
          status.className = "status";
        } else if (sources.length > 1) {
          primaryState.textContent = "请选择用于视频助手的主要文本来源";
          status.textContent = "查看来源不会改变主要文本来源，必须点击“用于视频助手”。";
          status.className = "status";
        } else if (state.trackDetected) {
          primaryState.textContent = "暂无正文";
          status.textContent = "已探测到轨道，但没有取得正文；请在播放器中开启“中文 AI”字幕后重新检测。";
          status.className = "status";
        } else {
          primaryState.textContent = "暂无正文";
          status.textContent = "请先在 B 站播放器中手动开启“中文 AI”字幕，然后重新检测字幕。";
          status.className = "status";
        }

        requestCount.textContent = `完整文本请求：${state.fullTextRequests}`;
        switchHint.textContent = sources.length <= 1
          ? "只有一个来源时不显示无意义切换。"
          : "当前有多个来源：查看来源和主要来源分开。";

        renderSources(sources);
      }

      function renderSources(sources) {
        const root = document.querySelector('[data-testid="sources"]');
        root.textContent = "";
        if (sources.length === 0) {
          const empty = document.createElement("p");
          empty.className = "muted";
          empty.textContent = "暂无可查看正文。";
          root.appendChild(empty);
          return;
        }

        for (const source of sources) {
          const card = document.createElement("article");
          card.className = "source-card";
          card.dataset.viewing = String((state.viewing || state.primary) === source);
          card.dataset.primary = String(state.primary === source);
          const title = document.createElement("strong");
          title.textContent = sourceLabels[source];
          const meta = document.createElement("p");
          meta.className = "muted";
          meta.textContent = source === "bilibili"
            ? "已取得当前分 P 字幕正文。"
            : "已完成的本地转录稿；本页不实现转录。";
          const actions = document.createElement("div");
          actions.className = "actions";
          const view = document.createElement("button");
          view.type = "button";
          view.textContent = "查看";
          view.setAttribute("aria-pressed", String((state.viewing || state.primary) === source));
          view.addEventListener("click", () => {
            state.viewing = source;
            render();
          });
          const primary = document.createElement("button");
          primary.type = "button";
          primary.className = "primary";
          primary.textContent = "用于视频助手";
          primary.setAttribute("aria-pressed", String(state.primary === source));
          primary.addEventListener("click", () => {
            state.primary = source;
            state.viewing = source;
            render();
          });
          actions.append(view, primary);
          card.append(title, meta, actions);
          root.appendChild(card);
        }
      }

      document.querySelector('[data-testid="enable-ai-subtitle"]').addEventListener("click", () => {
        state.trackDetected = true;
        render();
      });

      document.querySelector('[data-testid="redetect"]').addEventListener("click", () => {
        if (!state.trackDetected) {
          state.possibleAiSubtitle = false;
          render();
          return;
        }
        state.bilibiliBody = true;
        state.selectionCleared = false;
        if (!state.viewing) state.viewing = "bilibili";
        render();
      });

      document.querySelector('[data-testid="add-local"]').addEventListener("click", () => {
        state.localTranscript = true;
        state.primary = null;
        state.selectionCleared = false;
        state.viewing = state.viewing || "local";
        render();
      });

      document.querySelector('[data-testid="clear-current"]').addEventListener("click", () => {
        if (state.primary === "bilibili") state.bilibiliBody = false;
        if (state.primary === "local") state.localTranscript = false;
        state.primary = null;
        state.selectionCleared = true;
        render();
      });

      document.querySelector('[data-testid="auth-toggle"]').addEventListener("change", () => {
        render();
      });

      window.__mockState = state;
      render();
    </script>
  </body>
</html>
